[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpy-core"
version = "2.0.0"
description = "Professional async-first Minecraft Java Edition protocol library — 1.7.2 through 1.21.11, multi-language bridge, humanized anti-bot joining"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "McPy-Core Contributors" }
]
keywords = [
    "minecraft", "protocol", "client", "bot", "async", "asyncio",
    "java-edition", "mc", "framework", "anti-bot", "humanize",
    "1.7", "1.8", "1.12", "1.16", "1.17", "1.19", "1.20", "1.21",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
mcpycore-bridge = "mcpycore.bridge.__main__:main"

[project.urls]
Homepage      = "https://github.com/og-py3/McPy-Core"
Documentation = "https://github.com/og-py3/McPy-Core/blob/main/docs/quickstart.md"
Issues        = "https://github.com/og-py3/McPy-Core/issues"
Changelog     = "https://github.com/og-py3/McPy-Core/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["mcpycore*"]

[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
log_cli         = true
log_cli_level   = "WARNING"

[tool.black]
line-length    = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version         = "3.12"
strict                 = true
warn_return_any        = true
warn_unused_ignores    = true
disallow_untyped_defs  = true
