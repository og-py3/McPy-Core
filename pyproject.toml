[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mcpycore"
version = "0.4.0"
description = "A modern Python library for interacting with Minecraft Java Edition servers (1.20.2–1.21.11)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mcpycore Contributors" }
]
keywords = ["minecraft", "protocol", "client", "bot", "mc", "java-edition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/youruser/mcpycore"
Issues = "https://github.com/youruser/mcpycore/issues"
Changelog = "https://github.com/youruser/mcpycore/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcpycore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
